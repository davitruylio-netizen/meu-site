<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Freddy's</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            display: flex; justify-content: center; align-items: center;
        }

        #game-wrapper {
            position: relative;
            width: 1000px; height: 562px;
            background: #000;
            border: 2px solid #1a1a1a;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
        }

        canvas {
            display: block;
            width: 100%; height: 100%;
            image-rendering: pixelated;
        }

        /* --- MENU INICIAL IDENTICO AO ORIGINAL --- */
        #menu-screen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100; display: flex;
            flex-direction: column; justify-content: space-between;
            padding: 40px 60px; pointer-events: none;
        }

        .menu-title-group {
            font-size: 2.4rem; font-weight: bold;
            line-height: 1.1; color: #fff;
            text-shadow: 3px 3px 0px #000;
            letter-spacing: 2px;
            pointer-events: auto;
        }

        .menu-options-list {
            display: flex; flex-direction: column;
            gap: 14px; margin-top: 25px;
            pointer-events: auto;
        }

        .menu-item {
            font-size: 1.5rem; color: #aaa;
            cursor: pointer; transition: all 0.1s;
            width: max-content; font-weight: bold;
            display: flex; align-items: center; gap: 10px;
        }
        .menu-item:hover { color: #fff; text-shadow: 0 0 10px #fff; }
        .menu-item:hover::before { content: '>>'; color: #fff; }

        .copyright-text {
            font-size: 11px; color: #555;
            align-self: flex-end; text-align: right;
            pointer-events: auto;
        }

        /* --- HUD DE JOGO --- */
        .hud-overlay {
            position: absolute; bottom: 20px; left: 20px;
            z-index: 10; pointer-events: none; display: none;
            flex-direction: column; gap: 6px;
            font-weight: bold; text-shadow: 2px 2px #000;
        }

        .night-time {
            position: absolute; top: 20px; right: 25px;
            font-size: 24px; text-align: right; display: none;
            z-index: 10; pointer-events: none;
            text-shadow: 2px 2px #000;
        }

        #camera-flip-btn {
            position: absolute; bottom: 8px; left: 50%;
            transform: translateX(-50%);
            width: 450px; height: 38px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px; cursor: pointer;
            z-index: 20; display: none;
            justify-content: center; align-items: center;
            font-size: 15px; letter-spacing: 3px; font-weight: bold;
            transition: all 0.2s;
        }
        #camera-flip-btn:hover { background: rgba(255, 255, 255, 0.35); border-color: #fff; }

        #cam-map-container {
            position: absolute; bottom: 55px; right: 20px;
            width: 290px; height: 230px;
            background: rgba(5, 8, 15, 0.85);
            border: 2px solid #444;
            z-index: 30; display: none;
            padding: 10px; border-radius: 4px;
        }

        .cam-btn {
            position: absolute; background: #1a1a24;
            border: 1px solid #666; color: #fff;
            padding: 4px 8px; font-size: 11px;
            cursor: pointer; font-family: inherit;
            border-radius: 3px; font-weight: bold;
        }
        .cam-btn.active { background: #1b5e20; border-color: #00e676; box-shadow: 0 0 8px #00e676; }

        #btn-cam1a { top: 15px; left: 115px; }
        #btn-cam1b { top: 45px; left: 105px; }
        #btn-cam1c { top: 85px; left: 80px; }
        #btn-cam5  { top: 55px; left: 20px; }
        #btn-cam3  { top: 145px; left: 20px; }
        #btn-cam2a { top: 140px; left: 100px; }
        #btn-cam2b { top: 175px; left: 100px; }
        #btn-cam4a { top: 140px; left: 170px; }
        #btn-cam4b { top: 175px; left: 170px; }
        #btn-cam7  { top: 55px; left: 220px; }
        #btn-cam6  { top: 115px; left: 220px; }

        #game-over-screen, #win-screen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000; z-index: 90;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="gameCanvas" width="1000" height="562"></canvas>

        <!-- MENU PRINCIPAL -->
        <div id="menu-screen">
            <div>
                <div class="menu-title-group">
                    Five<br>Nights<br>at<br>Freddy's
                </div>

                <div class="menu-options-list">
                    <div class="menu-item" id="btn-newgame" onclick="startNight()">New Game</div>
                    <div class="menu-item" id="btn-continue" onclick="startNight()">Continue</div>
                    <div class="menu-item" style="color: #444; cursor: not-allowed;">Night 6</div>
                    <div class="menu-item" style="color: #444; cursor: not-allowed;">Custom Night</div>
                </div>
            </div>

            <div class="copyright-text">
                © 2014 Scott Cawthon<br>
                HTML5 Web Port
            </div>
        </div>

        <!-- HUD DE JOGO -->
        <div class="hud-overlay" id="hud-overlay">
            <div style="font-size: 20px;">Power left: <span id="power-val">100</span>%</div>
            <div style="font-size: 15px; color: #aaa;">Usage: <span id="usage-bars" style="color:#00e676;">█</span></div>
        </div>

        <div class="night-time" id="night-time">
            <div style="font-size: 28px; font-weight: bold;"><span id="time-val">12</span> AM</div>
            <div style="font-size: 14px; color: #888;">Night 1</div>
        </div>

        <div id="camera-flip-btn" onclick="toggleMonitor()">[ MONITOR ]</div>

        <div id="cam-map-container">
            <button class="cam-btn active" id="btn-cam1a" onclick="selectCam('1A')">CAM 1A</button>
            <button class="cam-btn" id="btn-cam1b" onclick="selectCam('1B')">CAM 1B</button>
            <button class="cam-btn" id="btn-cam1c" onclick="selectCam('1C')">CAM 1C</button>
            <button class="cam-btn" id="btn-cam5"  onclick="selectCam('5')">CAM 5</button>
            <button class="cam-btn" id="btn-cam3"  onclick="selectCam('3')">CAM 3</button>
            <button class="cam-btn" id="btn-cam2a" onclick="selectCam('2A')">CAM 2A</button>
            <button class="cam-btn" id="btn-cam2b" onclick="selectCam('2B')">CAM 2B</button>
            <button class="cam-btn" id="btn-cam4a" onclick="selectCam('4A')">CAM 4A</button>
            <button class="cam-btn" id="btn-cam4b" onclick="selectCam('4B')">CAM 4B</button>
            <button class="cam-btn" id="btn-cam7"  onclick="selectCam('7')">CAM 7</button>
            <button class="cam-btn" id="btn-cam6"  onclick="selectCam('6')">CAM 6</button>
        </div>

        <div id="game-over-screen">
            <h1 style="color: #800; font-size: 4rem; margin-bottom: 20px;">GAME OVER</h1>
            <button onclick="location.reload()" style="background: none; border: 2px solid #555; color: #fff; padding: 12px 25px; cursor: pointer; font-family: inherit;">Try Again</button>
        </div>

        <div id="win-screen">
            <h1 style="color: #fff; font-size: 4rem; letter-spacing: 5px;">5 AM</h1>
            <h1 id="win-6am" style="color: #00e676; font-size: 6rem; letter-spacing: 6px; display: none;">6 AM</h1>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
