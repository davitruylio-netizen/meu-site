<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Neon: The Awakening</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #090a10;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .header-title {
            text-align: center;
            margin-bottom: 12px;
        }
        h1 {
            color: #00f0ff;
            text-shadow: 0 0 10px #00f0ff, 2px 2px #ff0055;
            font-size: 2rem;
            letter-spacing: 2px;
        }
        p.subtitle { color: #ff0055; font-size: 0.9rem; margin-top: 4px; }
        .game-wrapper {
            position: relative;
            border: 3px solid #00f0ff;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #0d0e17;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .controls-bar {
            margin-top: 12px;
            display: flex;
            gap: 15px;
            color: #a0a5b5;
            font-size: 13px;
        }
        kbd {
            background: #1a1c29;
            color: #00f0ff;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #00f0ff;
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>CYBER NEON: THE AWAKENING</h1>
        <p class="subtitle">Capítulo 1: A Fuga do Laboratório</p>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="850" height="480"></canvas>
    </div>

    <div class="controls-bar">
        <span><kbd>A</kbd> / <kbd>D</kbd> Mover</span>
        <span><kbd>W</kbd> / <kbd>Espaço</kbd> Pular (2x)</span>
        <span><kbd>Shift</kbd> Dash Lateral</span>
        <span><kbd>E</kbd> Interagir / Conversar</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
