<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Plataforma Pixel Art</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d0e15;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 { margin-bottom: 10px; color: #ff0055; text-shadow: 2px 2px #000; }
        .game-container {
            position: relative;
            border: 4px solid #2d3142;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
        }
        canvas {
            display: block;
            background: #1a1c23;
            /* Mantém os pixels nítidos sem borrar */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .controls-info {
            margin-top: 15px;
            color: #a0a5b5;
            font-size: 14px;
            text-align: center;
        }
        kbd {
            background: #2d3142;
            color: #fff;
            padding: 3px 7px;
            border-radius: 4px;
            border: 1px solid #4f566b;
        }
    </style>
</head>
<body>

    <h1>PIXEL RUNNER 2D</h1>
    
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>

    <div class="controls-info">
        Controles: <kbd>A</kbd> / <kbd>D</kbd> ou <kbd>←</kbd> <kbd>→</kbd> Mover | <kbd>W</kbd> / <kbd>Espaço</kbd> ou <kbd>↑</kbd> Pular
    </div>

    <script src="script.js"></script>
</body>g
</html>
