<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Flow — Parkour Animation Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #0b0d14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        #game-container {
            position: relative;
            width: 960px; height: 540px;
            background: #121520;
            border: 2px solid #00f0ff;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%; height: 100%;
            image-rendering: pixelated;
        }

        .hud-overlay {
            position: absolute; top: 15px; left: 20px;
            display: flex; gap: 20px; font-weight: bold;
            font-size: 14px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .hud-item {
            background: rgba(18, 21, 32, 0.8);
            padding: 6px 14px; border-radius: 6px;
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        .controls-hint {
            position: absolute; bottom: 15px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 15px; font-size: 12px; color: #a0a5b5;
            background: rgba(10, 12, 18, 0.85); padding: 8px 16px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        kbd {
            background: #00f0ff; color: #0b0d14;
            padding: 2px 6px; border-radius: 4px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="hud-overlay">
            <div class="hud-item">ESTADO: <span id="anim-state" style="color: #00f0ff;">CORRENDO</span></div>
            <div class="hud-item">VELOCIDADE: <span id="speed-val" style="color: #ff0055;">0 km/h</span></div>
        </div>

        <canvas id="gameCanvas" width="960" height="540"></canvas>

        <div class="controls-hint">
            <span><kbd>D</kbd> / <kbd>→</kbd> Correr</span>
            <span><kbd>W</kbd> / <kbd>Espaço</kbd> Pular / Escalar</span>
            <span><kbd>S</kbd> / <kbd>↓</kbd> Deslizar / Rolar</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
