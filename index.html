<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Game Architect - Procedural Client</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0b0c10; color: #fff; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; background: #000; }
        
        /* Overlays e Interface */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(10, 12, 16, 0.9); backdrop-filter: blur(8px); z-index: 10; transition: opacity 0.4s; }
        .hidden { opacity: 0; pointer-events: none; }
        .menu-card { background: rgba(22, 27, 34, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 40px; width: 90%; max-width: 600px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .menu-card h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(135deg, #00e699, #00b3ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .btn { background: linear-gradient(135deg, #00e699, #00b3ff); color: #0d0f12; border: none; padding: 14px 28px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; margin: 8px; text-transform: uppercase; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 230, 153, 0.4); }
        .btn-multi { background: linear-gradient(135deg, #ff0055, #ff8000); color: #fff; }
        .ai-log-box { background: rgba(13, 15, 18, 0.95); border: 1px solid rgba(0, 230, 153, 0.3); border-radius: 8px; padding: 15px; margin-top: 20px; text-align: left; font-family: monospace; font-size: 0.85rem; max-height: 150px; overflow-y: auto; color: #00e699; }
        
        /* HUD */
        #hud { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; z-index: 5; }
        .hud-card { background: rgba(22, 27, 34, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 20px; border-radius: 8px; }
        .health-bar { width: 200px; height: 12px; background: rgba(255, 255, 255, 0.1); border-radius: 6px; overflow: hidden; margin-top: 6px; }
        .health-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff4d4d, #ff8000); }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="hud">
            <div class="hud-card">
                <div id="player-title" style="font-weight: bold;">AI Architect Engine</div>
                <div class="health-bar"><div id="health-fill" class="health-fill"></div></div>
                <div id="hud-stats" style="font-size: 0.85rem; color: #8b949e; margin-top: 5px;">Abates: 0</div>
            </div>
        </div>

        <div id="main-menu" class="overlay">
            <div class="menu-card">
                <h1>AI Game Architect</h1>
                <p>Motor de Jogo Procedural - Java Backend + JS Frontend</p>
                <div style="margin-top: 20px;">
                    <button class="btn" onclick="startGame('SOLO')">Modo Solo</button>
                    <button class="btn btn-multi" onclick="startGame('MULTIPLAYER')">Multiplayer On-line</button>
                </div>
                <div class="ai-log-box" id="ai-logs">> Selecione o modo de jogo para iniciar a síntese procedural da IA...</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let socket = null;
        let myPlayerId = null;
        let worldConfig = null;
        let obstacles = [];
        let gameState = { players: [], enemies: [], bullets: [] };
        
        const keys = { w: false, a: false, s: false, d: false, shoot: false, angle: 0 };
        const mouse = { x: 0, y: 0 };
        const camera = { x: 0, y: 0 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('keydown', e => updateKey(e.code, true));
        window.addEventListener('keyup', e => updateKey(e.code, false));
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mousedown', e => { if (e.button === 0) keys.shoot = true; });
        window.addEventListener('mouseup', e => { if (e.button === 0) keys.shoot = false; });

        function updateKey(code, state) {
            if (code === 'KeyW' || code === 'ArrowUp') keys.w = state;
            if (code === 'KeyA' || code === 'ArrowLeft') keys.a = state;
            if (code === 'KeyS' || code === 'ArrowDown') keys.s = state;
            if (code === 'KeyD' || code === 'ArrowRight') keys.d = state;
        }

        function startGame(mode) {
            socket = new WebSocket('ws://localhost:8080/ws/game');

            socket.onopen = () => {
                socket.send(JSON.stringify({ action: 'JOIN', mode: mode }));
                document.getElementById('main-menu').classList.add('hidden');
            };

            socket.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'INIT') {
                    worldConfig = msg.config;
                    obstacles = msg.obstacles || [];
                    myPlayerId = msg.playerId;
                    renderLogs(worldConfig.logs);
                    document.getElementById('player-title').innerText = `Jogador (${worldConfig.perspective})`;
                } else if (msg.type === 'UPDATE') {
                    gameState = msg;
                }
            };

            // Loop de Envio de Input ao Servidor Java (60Hz)
            setInterval(() => {
                if (socket && socket.readyState === WebSocket.OPEN && myPlayerId) {
                    const screenCenterX = canvas.width / 2;
                    const screenCenterY = canvas.height / 2;
                    keys.angle = Math.atan2(mouse.y - screenCenterY, mouse.x - screenCenterX);
                    socket.send(JSON.stringify({ action: 'INPUT', input: keys }));
                }
            }, 1000 / 60);

            requestAnimationFrame(gameRenderLoop);
        }

        function renderLogs(logs) {
            const container = document.getElementById('ai-logs');
            container.innerHTML = logs.map(l => `<div>> ${l}</div>`).join('');
        }

        function gameRenderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const myPlayer = gameState.players.find(p => p.id === myPlayerId);
            if (myPlayer) {
                camera.x = myPlayer.x - canvas.width / 2;
                camera.y = myPlayer.y - canvas.height / 2;
                
                document.getElementById('hud-stats').innerText = `Abates: ${myPlayer.kills || 0}`;
                document.getElementById('health-fill').style.width = `${myPlayer.hp}%`;
            }

            // Renderizar Bioma de Fundo
            ctx.fillStyle = worldConfig ? worldConfig.biome.bg : '#050510';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Renderizar Estruturas/Obstáculos
            if (worldConfig) {
                ctx.fillStyle = worldConfig.biome.obstacle;
                ctx.strokeStyle = worldConfig.biome.primary;
                ctx.lineWidth = 2;
                obstacles.forEach(obs => {
                    ctx.fillRect(obs.x - camera.x, obs.y - camera.y, obs.w, obs.h);
                    ctx.strokeRect(obs.x - camera.x, obs.y - camera.y, obs.w, obs.h);
                });
            }

            // Renderizar Jogadores
            gameState.players.forEach(p => {
                ctx.save();
                ctx.translate(p.x - camera.x, p.y - camera.y);
                ctx.fillStyle = p.id === myPlayerId ? (worldConfig ? worldConfig.biome.primary : '#00f3ff') : '#ff0055';
                ctx.beginPath();
                ctx.arc(0, 0, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            });

            // Renderizar Inimigos
            gameState.enemies.forEach(e => {
                ctx.save();
                ctx.translate(e.x - camera.x, e.y - camera.y);
                ctx.fillStyle = worldConfig ? worldConfig.biome.secondary : '#ff0055';
                ctx.beginPath();
                ctx.arc(0, 0, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Renderizar Projéteis
            ctx.fillStyle = '#fff';
            gameState.bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x - camera.x, b.y - camera.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(gameRenderLoop);
        }
    </script>
</body>
</html>
