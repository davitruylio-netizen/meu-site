<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Game Architect - 3D Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #05050a; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(5, 5, 10, 0.85); backdrop-filter: blur(10px); z-index: 10; }
        .hidden { display: none !important; }
        .menu-card { background: rgba(20, 24, 33, 0.95); border: 1px solid rgba(0, 230, 153, 0.3); border-radius: 16px; padding: 40px; width: 90%; max-width: 550px; text-align: center; box-shadow: 0 0 30px rgba(0, 230, 153, 0.15); }
        .menu-card h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(135deg, #00e699, #00b3ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn { background: linear-gradient(135deg, #00e699, #00b3ff); color: #0d0f12; border: none; padding: 14px 28px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; margin: 8px; }
        .btn:hover { transform: scale(1.05); }

        #hud { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 5; }
        .hud-card { background: rgba(15, 18, 25, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); padding: 15px 25px; border-radius: 8px; }
    </style>
    <!-- Importando Three.js de forma simples -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud" class="hidden">
        <div class="hud-card">
            <h2 id="hud-title" style="color: #00e699;">Modo 3D</h2>
            <p id="hud-stats">Conectando ao servidor Java...</p>
        </div>
    </div>

    <div id="main-menu" class="overlay">
        <div class="menu-card">
            <h1>AI Architect 3D</h1>
            <p>Motor Tridimensional Procedural (Three.js + Java)</p>
            <div style="margin-top: 25px;">
                <button class="btn" onclick="init3DGame('SOLO')">Iniciar Solo 3D</button>
                <button class="btn" onclick="init3DGame('MULTIPLAYER')">Multiplayer 3D</button>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer;
        let players3D = {}, enemies3D = {}, bullets3D = [], obstacles3D = [];
        let socket = null, myPlayerId = null;
        const keys = { w: false, a: false, s: false, d: false, shoot: false, angle: 0 };

        function initScene() {
            // 1. Configurar Cena 3D
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05050a);
            scene.fog = new THREE.FogExp2(0x05050a, 0.015);

            // 2. Câmera (Visão Isométrica 3D / 3ª Pessoa)
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 35, 30);
            camera.lookAt(0, 0, 0);

            // 3. Renderizador WebGL
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 4. Luzes 3D
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00e699, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 5. Chão / Terreno 3D
            const gridHelper = new THREE.GridHelper(200, 50, 0x00e699, 0x222233);
            scene.add(gridHelper);

            window.addEventListener('resize', onWindowResize);
            setupInputs();
        }

        function init3DGame(mode) {
            initScene();
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');

            // Conectar ao Backend Java
            socket = new WebSocket('ws://localhost:8080/ws/game');

            socket.onopen = () => {
                socket.send(JSON.stringify({ action: 'JOIN', mode: mode }));
            };

            socket.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'INIT') {
                    myPlayerId = msg.playerId;
                    buildObstacles3D(msg.obstacles || []);
                } else if (msg.type === 'UPDATE') {
                    update3DEntities(msg);
                }
            };

            // Loop de Envio de Input ao Java
            setInterval(() => {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ action: 'INPUT', input: keys }));
                }
            }, 1000 / 60);

            animate();
        }

        function buildObstacles3D(obstacles) {
            const mat = new THREE.MeshStandardMaterial({ color: 0x1a1a3a, roughness: 0.4 });
            obstacles.forEach(obs => {
                const geo = new THREE.BoxGeometry(obs.w / 10, 6, obs.h / 10);
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set((obs.x - 1200) / 10, 3, (obs.y - 900) / 10);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            });
        }

        function update3DEntities(state) {
            // Sincronizar Jogadores (Esferas/Modelos 3D)
            state.players.forEach(p => {
                let mesh = players3D[p.id];
                const targetX = (p.x - 1200) / 10;
                const targetZ = (p.y - 900) / 10;

                if (!mesh) {
                    const geo = new THREE.CapsuleGeometry(1, 2, 8, 16);
                    const mat = new THREE.MeshStandardMaterial({ color: p.id === myPlayerId ? 0x00f3ff : 0xff0055 });
                    mesh = new THREE.Mesh(geo, mat);
                    mesh.castShadow = true;
                    scene.add(mesh);
                    players3D[p.id] = mesh;
                }

                mesh.position.set(targetX, 1.5, targetZ);

                // Câmera segue o jogador local em 3D
                if (p.id === myPlayerId) {
                    camera.position.set(targetX, targetX + 25, targetZ + 25);
                    camera.lookAt(targetX, 0, targetZ);
                    document.getElementById('hud-stats').innerText = `Abates: ${p.kills || 0} | HP: ${p.hp}%`;
                }
            });

            // Sincronizar Inimigos 3D
            state.enemies.forEach(e => {
                let mesh = enemies3D[e.id];
                const ex = (e.x - 1200) / 10;
                const ez = (e.y - 900) / 10;

                if (!mesh) {
                    const geo = new THREE.SphereGeometry(1.2, 16, 16);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0x330011 });
                    mesh = new THREE.Mesh(geo, mat);
                    mesh.castShadow = true;
                    scene.add(mesh);
                    enemies3D[e.id] = mesh;
                }
                mesh.position.set(ex, 1.2, ez);
            });
        }

        function setupInputs() {
            window.addEventListener('keydown', e => {
                if (e.code === 'KeyW') keys.w = true;
                if (e.code === 'KeyS') keys.s = true;
                if (e.code === 'KeyA') keys.a = true;
                if (e.code === 'KeyD') keys.d = true;
            });
            window.addEventListener('keyup', e => {
                if (e.code === 'KeyW') keys.w = false;
                if (e.code === 'KeyS') keys.s = false;
                if (e.code === 'KeyA') keys.a = false;
                if (e.code === 'KeyD') keys.d = false;
            });
            window.addEventListener('mousedown', () => keys.shoot = true);
            window.addEventListener('mouseup', () => keys.shoot = false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
