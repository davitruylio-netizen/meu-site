<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Multiuso Web</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121214; color: #e1e1e6; padding: 20px; min-height: 100vh; }
        header { text-align: center; margin-bottom: 25px; }
        header h1 { color: #00875f; margin-bottom: 5px; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
        .card { background: #202024; border: 1px solid #323238; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .card h2 { border-bottom: 1px solid #323238; padding-bottom: 8px; font-size: 1.2rem; }
        
        /* Calculadora */
        .calc-display { background: #121214; color: #00b37e; font-size: 2rem; padding: 15px; text-align: right; border-radius: 8px; border: 1px solid #323238; min-height: 60px; font-weight: bold; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .calc-grid button { background: #29292e; color: #fff; border: none; padding: 15px; border-radius: 6px; font-size: 1.2rem; cursor: pointer; }
        .calc-grid button:active { background: #3b3b42; }
        .calc-grid button.op { background: #00875f; font-weight: bold; }

        /* IA Chat */
        .chat-container { display: flex; flex-direction: column; height: 320px; }
        .chat-box { flex: 1; background: #121214; border: 1px solid #323238; border-radius: 8px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg-user { background: #00875f; color: #fff; align-self: flex-end; padding: 8px 12px; border-radius: 10px 10px 0 10px; max-width: 80%; }
        .msg-ai { background: #29292e; color: #e1e1e6; align-self: flex-start; padding: 8px 12px; border-radius: 10px 10px 10px 0; max-width: 80%; }
        .chat-input-area { display: flex; gap: 8px; margin-top: 10px; }
        .chat-input-area input { flex: 1; background: #121214; border: 1px solid #323238; color: #fff; padding: 10px; border-radius: 6px; }
        .chat-input-area button { background: #00875f; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* Google Search */
        .search-box { display: flex; gap: 8px; }
        .search-box input { flex: 1; background: #121214; border: 1px solid #323238; color: #fff; padding: 10px; border-radius: 6px; }
        .search-box button { background: #4285f4; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>Painel Multiuso Web</h1>
        <p>Calculadora, Pesquisa e Assistente Inteligente</p>
    </header>

    <main class="dashboard">
        <!-- Calculadora -->
        <section class="card">
            <h2>🧮 Calculadora</h2>
            <div class="calc-display" id="calc-display">0</div>
            <div class="calc-grid">
                <button onclick="clearCalc()">C</button>
                <button onclick="calcInput('(')">(</button>
                <button onclick="calcInput(')')">)</button>
                <button class="op" onclick="calcInput('/')">÷</button>
                
                <button onclick="calcInput('7')">7</button>
                <button onclick="calcInput('8')">8</button>
                <button onclick="calcInput('9')">9</button>
                <button class="op" onclick="calcInput('*')">×</button>
                
                <button onclick="calcInput('4')">4</button>
                <button onclick="calcInput('5')">5</button>
                <button onclick="calcInput('6')">6</button>
                <button class="op" onclick="calcInput('-')">-</button>
                
                <button onclick="calcInput('1')">1</button>
                <button onclick="calcInput('2')">2</button>
                <button onclick="calcInput('3')">3</button>
                <button class="op" onclick="calcInput('+')">+</button>
                
                <button onclick="calcInput('0')">0</button>
                <button onclick="calcInput('.')">.</button>
                <button onclick="backspaceCalc()">⌫</button>
                <button class="op" onclick="calculateResult()">=</button>
            </div>
        </section>

        <!-- Pesquisa -->
        <section class="card">
            <h2>🔍 Pesquisa Google</h2>
            <div class="search-box">
                <input type="text" id="search-query" placeholder="Digite para pesquisar..." onkeypress="if(event.key==='Enter') openGoogleModal()">
                <button onclick="openGoogleModal()">Pesquisar</button>
            </div>
        </section>

        <!-- IA -->
        <section class="card">
            <h2>🤖 Assistente IA</h2>
            <div class="chat-container">
                <div class="chat-box" id="chat-box">
                    <div class="msg-ai">Olá! Como posso te ajudar hoje?</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="ai-input" placeholder="Faça uma pergunta..." onkeypress="if(event.key==='Enter') sendAIMessage()">
                    <button onclick="sendAIMessage()">Enviar</button>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
